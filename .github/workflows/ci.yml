name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: SwiftFormat
        uses: nicklockwood/SwiftFormat@0.61.0
        with:
          args: --lint

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict

  # ── macOS ──────────────────────────────────────────────────────────────────
  test-macos:
    name: Test · macOS (${{ matrix.xcode }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode:
          - "26.0"   # Swift 6.2
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Build and test
        run: swift test --configuration debug --enable-code-coverage

      - name: Coverage report
        run: |
          xcrun llvm-cov report \
            .build/debug/SqlCipherKitPackageTests.xctest/Contents/MacOS/SqlCipherKitPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            --ignore-filename-regex=".build|CSqlCipher" \
            --summary-only

      - name: Build for iOS (deployment target check)
        run: |
          xcodebuild build \
            -scheme SqlCipherKit \
            -destination 'generic/platform=iOS' \
            SWIFT_STRICT_CONCURRENCY=complete \
            | xcpretty || true

  # ── Linux ──────────────────────────────────────────────────────────────────
  test-linux:
    name: Test · Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift:
          - "6.1"
          - "6.2"
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v6

      - name: Install libssl-dev
        run: apt-get update -q && apt-get install -y libssl-dev

      - name: Build and test
        run: swift test --configuration debug --enable-code-coverage

      - name: Coverage report
        run: |
          llvm-cov report \
            .build/debug/SqlCipherKitPackageTests.xctest \
            -instr-profile .build/debug/codecov/default.profdata \
            --ignore-filename-regex=".build|CSqlCipher" \
            --summary-only
